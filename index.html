<style>
/* Layout: card preview pinned beside (desktop) or above (phone) one input column; 青空教室 palette from the camp slides (sky, white cards, green ink, amber accents) */
:root {
  --sky: #74c3ea;
  --sky-top: #cdebf8;
  --bg: #f2fafd;
  --panel: #ffffff;
  --field: #f6fbf7;
  --line: #cfe7d4;
  --line-strong: #a8d5b0;
  --green: #2f7a50;
  --green-deep: #1e5637;
  --ink: #24402f;
  --muted: #5e8270;
  --amber: #f0962e;
  --warn: #b85d12;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  background-image: linear-gradient(to bottom, var(--sky-top) 0, var(--bg) 360px);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 16px;
  padding-block: 20px 48px;
}
.top { margin: 0; display: flex; align-items: center; gap: 14px; min-width: 0; }
.top .logo { flex: none; height: 76px; width: auto; filter: drop-shadow(0 4px 8px rgba(46, 110, 140, .18)); }
.top-text { display: grid; gap: 4px; min-width: 0; }
@media (min-width: 860px) { .top .logo { height: 104px; } }

/* characters peeking over the top edge of each input panel */
.group { position: relative; }
.group.peek { margin-top: 44px; }
.peek-img {
  position: absolute; right: 14px; top: -64px;
  height: 104px; width: auto;
  pointer-events: none;
  filter: drop-shadow(0 4px 6px rgba(46, 110, 140, .18));
}
.rest { display: grid; justify-items: center; gap: 2px; padding-top: 6px; }
.rest img { height: 120px; width: auto; }
.rest p { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
a.filebtn { text-decoration: none; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .32em; color: var(--green); }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(24px, 6vw, 34px);
  line-height: 1.25;
  color: var(--green-deep);
  text-wrap: balance;
}
.lead { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

.layout { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.stage { display: grid; gap: 8px; justify-items: center; min-width: 0; }
.stage canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 896 / 1194;
  max-width: 100%;
  border-radius: 8px;
  box-shadow: 0 10px 28px rgba(46, 110, 140, .28);
  cursor: pointer;
  touch-action: manipulation;
}
.stage canvas.has-photo { touch-action: none; }
.stage .hint { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }

@media (max-width: 859px) {
  .stage {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--sky-top);
    padding-block: 8px 10px;
    border-bottom: 1px solid var(--line-strong);
    margin-inline: -16px;
    padding-inline: 16px;
  }
  .stage canvas { width: min(100%, calc(38vh * .7504)); width: min(100%, calc(38svh * .7504)); }
}
/* Desktop: the whole card sits top-left in the first screen (this is also what the link preview captures) */
@media (min-width: 860px) {
  .layout {
    grid-template-columns: min-content minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas: "stage head" "stage panel";
    column-gap: 32px;
    row-gap: 18px;
    align-items: start;
  }
  .top { grid-area: head; padding-top: 6px; }
  .stage { grid-area: stage; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  .panel { grid-area: panel; }
  .stage canvas {
    max-width: none;
    width: clamp(300px, calc((100vh - 84px) * .7504), 520px);
    width: clamp(300px, calc((100svh - 84px) * .7504), 520px);
  }
}

.panel { display: grid; gap: 14px; min-width: 0; }
.group {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: grid;
  gap: 14px;
  min-width: 0;
  box-shadow: 0 3px 12px rgba(46, 110, 140, .08);
}
.group h2 { margin: 0; font-size: 12px; letter-spacing: .18em; color: var(--green); font-weight: 700; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: minmax(0, 1fr); } }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .label {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 14px; letter-spacing: .04em; color: var(--green-deep);
}
.field > label::before, .label::before {
  content: ""; width: 11px; height: 11px; border-radius: 50%;
  background: var(--amber);
  box-shadow: inset -2px -2px 0 rgba(0, 0, 0, .12);
  flex: none;
}
input[type="text"], textarea {
  width: 100%; min-width: 0;
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--field);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px 12px;
  line-height: 1.5;
}
textarea { resize: vertical; min-height: 84px; }
input::placeholder, textarea::placeholder { color: #9bb8a6; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .chip:focus-within {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
.warn { margin: 0; font-size: 12px; color: var(--warn); font-weight: 700; }
.tip { margin: 0; font-size: 12px; color: var(--muted); }

.photo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.thumb {
  width: 72px; height: 72px; border-radius: 50%;
  background: #ffffff center / cover no-repeat;
  border: 4px solid #fff;
  box-shadow: 0 0 0 1px var(--line-strong), 0 3px 8px rgba(46, 110, 140, .2);
}
.photo-ctrl { display: grid; gap: 8px; min-width: 0; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.zoom { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.zoom input { flex: 1; min-width: 0; accent-color: var(--green); }

button, .filebtn {
  font: inherit; font-size: 14px; font-weight: 700;
  border-radius: 10px;
  border: 1px solid var(--line-strong);
  background: #fff;
  color: var(--green-deep);
  padding: 8px 14px;
  cursor: pointer;
}
button:hover, .filebtn:hover { border-color: var(--green); }
.filebtn { display: inline-flex; align-items: center; gap: 6px; position: relative; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.seg button { display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; font-size: 11px; letter-spacing: .12em; }
.seg svg { width: 30px; height: 26px; }
.seg button[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip span {
  display: block; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: #fff; color: var(--green-deep); font-size: 14px;
}
.chip input:checked + span { background: var(--green); color: #fff; border-color: var(--green); }
.swatch span { display: flex; align-items: center; gap: 8px; }
.swatch i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-strong); display: block; }

.actions {
  position: sticky; bottom: 0;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, rgba(242, 250, 253, 0));
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.primary {
  flex: 1 1 200px;
  background: var(--green); color: #fff; border-color: var(--green);
  font-size: 16px; padding: 13px 18px; letter-spacing: .04em;
  box-shadow: 0 4px 12px rgba(47, 122, 80, .3);
}
.primary:hover { background: var(--green-deep); border-color: var(--green-deep); }
.ghost.armed { border-color: var(--warn); color: var(--warn); }

.toast {
  position: fixed; left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--green-deep); color: #fff;
  font-weight: 700; font-size: 14px;
  padding: 10px 16px; border-radius: 999px; z-index: 30;
  max-width: calc(100% - 32px);
}
.sheet {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(20, 52, 38, .82);
  display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
.sheet-inner { display: grid; gap: 12px; justify-items: center; max-width: 520px; width: 100%; }
.sheet img { width: auto; max-width: 100%; max-height: 70vh; border-radius: 8px; -webkit-touch-callout: default; }
.sheet p { margin: 0; text-align: center; font-size: 14px; color: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
}
</style>
</head>
<body>
<main class="layout">
  <header class="top">
    <img class="logo" src="logo.webp" width="309" height="300" alt="TFT Training Camp! 合宿">
    <div class="top-text">
      <h1>プロフィールカードメーカー</h1>
      <p class="lead">入力した内容がそのままカードに入ります。長い文章は自動で文字が小さくなります。</p>
    </div>
  </header>

  <section class="stage" aria-label="カードのプレビュー">
    <canvas id="card" width="1792" height="2388" role="img" aria-label="プロフィールカードのプレビュー。欄をタップするとその入力欄に移動します"></canvas>
    <p class="hint">薄い文字は記入例です。カードの欄をタップするとその入力欄へ移動します</p>
  </section>

  <form class="panel" id="form" autocomplete="off">
    <div class="group peek">
      <img class="peek-img" src="chara-penguin.webp" width="229" height="240" alt="">
      <h2>PHOTO</h2>
      <div class="photo">
        <div class="thumb" id="thumb" aria-hidden="true"></div>
        <div class="photo-ctrl">
          <div class="btns">
            <label class="filebtn">写真を選ぶ<input type="file" id="f-photo" accept="image/*"></label>
            <button type="button" id="photo-clear" hidden>写真を外す</button>
          </div>
          <label class="zoom" for="f-zoom" id="zoom-wrap" hidden>拡大 <input type="range" id="f-zoom" min="1" max="3" step="0.01" value="1"></label>
          <p class="tip" id="photo-tip" hidden>カードの丸の中をドラッグすると位置を動かせます</p>
        </div>
      </div>
    </div>

    <div class="group peek">
      <img class="peek-img" src="chara-dragon.webp" width="241" height="240" alt="">
      <h2>PROFILE</h2>
      <div class="field"><label for="f-name">NAME</label><input type="text" id="f-name" data-key="name" placeholder="例：やまだ たろう"><p class="warn" id="w-name" hidden></p></div>
      <div class="field"><label for="f-riot">Riot ID</label><input type="text" id="f-riot" data-key="riot" placeholder="例：Taro#JP1"><p class="warn" id="w-riot" hidden></p></div>
      <div class="row2">
        <div class="field"><label for="f-set">始めたSET</label><input type="text" id="f-set" data-key="set" placeholder="例：SET 10"><p class="warn" id="w-set" hidden></p></div>
        <div class="field"><label for="f-time">プレイ時間帯</label><input type="text" id="f-time" data-key="time" placeholder="例：平日の夜"><p class="warn" id="w-time" hidden></p></div>
      </div>
      <div class="field"><label for="f-comp">好きな構成-駒</label><input type="text" id="f-comp" data-key="comp" placeholder="例：リロール構成 / アーリ"><p class="warn" id="w-comp" hidden></p></div>
      <div class="field"><label for="f-goal">自分の目標/意気込み</label><textarea id="f-goal" data-key="goal" rows="4" placeholder="例：合宿中にマスター到達が目標です！&#10;毎試合振り返りをして、先生のアドバイスを次の試合ですぐ実践します。"></textarea><p class="warn" id="w-goal" hidden></p></div>
      <div class="field"><label for="f-intro">自己紹介/自分を一言で表すと</label><textarea id="f-intro" data-key="intro" rows="4" placeholder="例：一言で表すと「コツコツ型の負けず嫌い」です。&#10;わからないことは積極的に質問します。よろしくお願いします！"></textarea><p class="warn" id="w-intro" hidden></p></div>
    </div>

    <div class="group peek">
      <img class="peek-img" src="chara-poro.webp" width="267" height="240" alt="">
      <h2>PLATFORM</h2>
      <div class="seg" id="seg" role="group" aria-label="Platform">
        <button type="button" data-plat="" aria-pressed="true">
          <svg viewBox="0 0 30 26" aria-hidden="true"><circle cx="15" cy="13" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8.6 19.4 21.4 6.6" stroke="currentColor" stroke-width="2.4"/></svg>なし</button>
        <button type="button" data-plat="pc" aria-pressed="false">
          <svg viewBox="0 0 30 26" aria-hidden="true"><rect x="1.5" y="3" width="18" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M6 22h9M10.5 16v6" stroke="currentColor" stroke-width="2.4"/><rect x="22" y="2" width="6.5" height="21" rx="1" fill="currentColor"/></svg>PC</button>
        <button type="button" data-plat="mobile" aria-pressed="false">
          <svg viewBox="0 0 30 26" aria-hidden="true"><rect x="9" y="1.5" width="12" height="23" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.4" transform="rotate(14 15 13)"/></svg>MOBILE</button>
        <button type="button" data-plat="both" aria-pressed="false">
          <svg viewBox="0 0 30 26" aria-hidden="true"><rect x="1" y="2" width="14" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M5 15.5h6" stroke="currentColor" stroke-width="2.2"/><rect x="18" y="9" width="9" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>BOTH</button>
      </div>
    </div>

    <div class="rest">
      <img src="chara-sleep.webp" width="344" height="320" alt="">
      <p>入力できたら「画像を保存」でカードを保存しよう</p>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="save">画像を保存（PNG）</button>
      <button type="button" class="ghost" id="reset">リセット</button>
    </div>
  </form>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <img id="sheet-img" alt="完成したプロフィールカード">
    <p>画像を長押し（PCは右クリック）して保存してください</p>
    <div class="btns">
      <a class="filebtn" id="sheet-dl" href="#" hidden>ファイルとして保存</a>
      <button type="button" id="sheet-close">閉じる</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  let avatarImg = null;
  const R = () => THEME.circleR;

  // ---------- storage (per-viewer draft) ----------
  function loadDraft() {
    try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(state, JSON.parse(raw)); } catch (e) {}
  }
  let saveT;
  function saveDraft() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(state)); }
      catch (e) { try { localStorage.setItem(KEY, JSON.stringify({ ...state, avatar: null })); } catch (e2) {} }
    }, 400);
  }

  // ---------- text layout ----------
  const fontStr = (size) => { const f = FONTS[state.font] || FONTS.noto; return `${f.w} ${size}px ${f.fam}, ${FALLBACK}`; };
  const tokenize = (s) => s.match(/[A-Za-z0-9#@'’&+\-_.:/]+|\s|./gu) || [];
  function splitChars(c, tok, line, maxW, out) {
    for (const ch of [...tok]) {
      const t = line + ch;
      if (c.measureText(t).width > maxW && line) { out.push(line); line = ch; } else line = t;
    }
    return line;
  }
  function wrap(c, text, maxW) {
    const out = [];
    for (const para of text.split("\n")) {
      let line = "";
      for (const tok of tokenize(para)) {
        const isSpace = /^\s$/.test(tok);
        if (line === "" && isSpace) continue;
        const trial = line + tok;
        if (c.measureText(trial).width <= maxW) { line = trial; continue; }
        if (isSpace) { out.push(line); line = ""; continue; }
        if ([...tok].length === 1 && NO_START.includes(tok) && line) { line = trial; continue; }
        if (line) out.push(line.replace(/\s+$/, ""));
        line = c.measureText(tok).width > maxW ? splitChars(c, tok, "", maxW, out) : tok;
      }
      out.push(line);
    }
    return out;
  }
  function drawSingle(c, text, box, maxSize) {
    const pad = 16, maxW = box.w - pad * 2;
    text = text.replace(/\s*\n\s*/g, " ");
    let size = maxSize;
    for (; size > 14; size--) { c.font = fontStr(size); if (c.measureText(text).width <= maxW) break; }
    c.font = fontStr(size);
    const over = c.measureText(text).width > maxW;
    const center = state.align === "center";
    c.textAlign = center ? "center" : "left";
    c.fillText(text, center ? box.x + box.w / 2 : box.x + pad, box.y + box.h / 2 + size * 0.04, maxW);
    return over;
  }
  function drawMulti(c, text, box, maxSize) {
    const pad = 18, maxW = box.w - pad * 2, maxH = box.h - pad * 2;
    let size = maxSize, lines, lh, over = false;
    for (;; size--) {
      c.font = fontStr(size);
      lh = Math.round(size * 1.4);
      lines = wrap(c, text, maxW);
      if (lines.length * lh - (lh - size) <= maxH) break;
      if (size <= 13) { over = true; lines = lines.slice(0, Math.max(1, Math.floor((maxH + lh - size) / lh))); break; }
    }
    const blockH = lines.length * lh - (lh - size);
    const top = box.y + (box.h - blockH) / 2;
    const center = state.align === "center";
    c.textAlign = center ? "center" : "left";
    const x = center ? box.x + box.w / 2 : box.x + pad;
    lines.forEach((ln, i) => c.fillText(ln, x, top + i * lh + size / 2 + size * 0.04, maxW));
    return over;
  }

  // ---------- render ----------
  function coverScale(img) { return Math.max((R() * 2) / img.naturalWidth, (R() * 2) / img.naturalHeight) * state.zoom; }
  function clampOffset() {
    if (!avatarImg) return;
    const s = coverScale(avatarImg);
    const mx = Math.max(0, (avatarImg.naturalWidth * s) / 2 - R());
    const my = Math.max(0, (avatarImg.naturalHeight * s) / 2 - R());
    state.offX = Math.min(mx, Math.max(-mx, state.offX));
    state.offY = Math.min(my, Math.max(-my, state.offY));
  }

  function renderTo(cv, ghost) {
    const c = cv.getContext("2d");
    const th = THEME;
    c.setTransform(S, 0, 0, S, 0, 0);
    c.imageSmoothingEnabled = true;
    c.imageSmoothingQuality = "high";
    c.clearRect(0, 0, W, H);
    if (tpl.complete && tpl.naturalWidth) {
      c.drawImage(tpl, 0, 0, W, H);
    }

    if (avatarImg) {
      const s = coverScale(avatarImg);
      const dw = avatarImg.naturalWidth * s, dh = avatarImg.naturalHeight * s;
      c.save();
      c.beginPath(); c.arc(CIRCLE.x, CIRCLE.y, R(), 0, Math.PI * 2); c.clip();
      c.drawImage(avatarImg, CIRCLE.x - dw / 2 + state.offX, CIRCLE.y - dh / 2 + state.offY, dw, dh);
      c.restore();
      c.beginPath(); c.arc(CIRCLE.x, CIRCLE.y, R() + 1, 0, Math.PI * 2);
      c.lineWidth = 4; c.strokeStyle = "#231F35"; c.stroke();
    } else if (ghost) {
      c.fillStyle = th.photoHint;
      c.textAlign = "center"; c.textBaseline = "middle";
      c.font = `700 22px "Noto Sans JP", ${FALLBACK}`;
      c.fillText("＋", CIRCLE.x, CIRCLE.y - 16);
      c.font = `700 17px "Noto Sans JP", ${FALLBACK}`;
      c.fillText("タップで写真", CIRCLE.x, CIRCLE.y + 14);
    }

    const overflow = {};
    c.textBaseline = "middle";
    for (const f of FIELDS) {
      const v = (state.values[f.key] || "").trim();
      const text = v || (ghost ? f.ex : "");
      if (!text) { overflow[f.key] = false; continue; }
      c.fillStyle = v ? state.color : th.ghost;
      overflow[f.key] = (f.multi ? drawMulti(c, text, f.box, f.max) : drawSingle(c, text, f.box, f.max)) && !!v;
    }

    const p = PLAT[state.platform];
    if (p) {
      c.save();
      c.beginPath();
      c.ellipse(p.x, p.y, 72, 70, -0.1, 0, Math.PI * 2);
      c.lineWidth = 7; c.strokeStyle = th.ring; c.stroke();
      c.restore();
    }
    return overflow;
  }

  let raf = 0;
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const over = renderTo(canvas, true);
      for (const f of FIELDS) {
        const w = $("w-" + f.key);
        if (!w) continue;
        w.hidden = !over[f.key];
        w.textContent = over[f.key] ? "長すぎて枠に入りきりません。少し短くしてください" : "";
      }
    });
  }

  document.fonts.load(`700 22px "Noto Sans JP"`, "タップで写真＋").catch(() => {}).then(schedule);

  async function ensureFont() {
    const f = FONTS[state.font] || FONTS.noto;
    const sample = Object.values(state.values).join("") + FIELDS.map((x) => x.ex).join("");
    try { await document.fonts.load(`${f.w} 30px ${f.fam}`, sample || "あ"); } catch (e) {}
  }
  function refresh() { schedule(); ensureFont().then(schedule); saveDraft(); }

  // ---------- inputs ----------
  const inputs = [...document.querySelectorAll("[data-key]")];
  inputs.forEach((el) => el.addEventListener("input", () => { state.values[el.dataset.key] = el.value; refresh(); }));

  const segBtns = [...document.querySelectorAll("#seg button")];
  function setPlatform(v) {
    state.platform = v;
    segBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.plat === v)));
    refresh();
  }
  segBtns.forEach((b) => b.addEventListener("click", () => setPlatform(b.dataset.plat)));

  // ---------- photo ----------
  const fileInput = $("f-photo");
  const zoom = $("f-zoom");
  function syncPhotoUI() {
    const has = !!avatarImg;
    $("photo-clear").hidden = !has;
    $("zoom-wrap").hidden = !has;
    $("photo-tip").hidden = !has;
    $("thumb").style.backgroundImage = has ? `url("${state.avatar}")` : "";
    canvas.classList.toggle("has-photo", has);
    zoom.value = state.zoom;
  }
  function setAvatar(dataUrl, keepPos) {
    if (!dataUrl) { avatarImg = null; state.avatar = null; syncPhotoUI(); refresh(); return; }
    const img = new Image();
    img.onload = () => {
      avatarImg = img; state.avatar = dataUrl;
      if (!keepPos) { state.zoom = 1; state.offX = 0; state.offY = 0; }
      clampOffset(); syncPhotoUI(); refresh();
    };
    img.src = dataUrl;
  }
  function readPhoto(file) {
    if (!file || !file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const m = 900, k = Math.min(1, m / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
        const cx = cv.getContext("2d");
        cx.fillStyle = "#FFFFFF";
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        setAvatar(cv.toDataURL("image/jpeg", 0.9), false);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  fileInput.addEventListener("change", () => { readPhoto(fileInput.files[0]); fileInput.value = ""; });
  $("photo-clear").addEventListener("click", () => setAvatar(null));
  zoom.addEventListener("input", () => { state.zoom = +zoom.value; clampOffset(); refresh(); });

  // ---------- canvas interactions ----------
  const toBase = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  };
  const inCircle = (p) => Math.hypot(p.x - CIRCLE.x, p.y - CIRCLE.y) <= R() + 4;
  let drag = null, moved = false;
  canvas.addEventListener("pointerdown", (e) => {
    moved = false;
    if (!avatarImg || !inCircle(toBase(e))) return;
    drag = { x: e.clientX, y: e.clientY, ox: state.offX, oy: state.offY };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const k = W / canvas.getBoundingClientRect().width;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    state.offX = drag.ox + dx * k; state.offY = drag.oy + dy * k;
    clampOffset(); schedule();
  });
  const endDrag = () => { if (drag) { drag = null; saveDraft(); } };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", (e) => {
    if (!avatarImg || !inCircle(toBase(e))) return;
    e.preventDefault();
    state.zoom = Math.min(3, Math.max(1, state.zoom - e.deltaY * 0.0015));
    zoom.value = state.zoom; clampOffset(); refresh();
  }, { passive: false });
  canvas.addEventListener("click", (e) => {
    if (moved) return;
    const p = toBase(e);
    if (inCircle(p)) { if (!avatarImg) fileInput.click(); return; }
    for (const f of FIELDS) {
      const b = f.box;
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y - 34 && p.y <= b.y + b.h) {
        const el = $("f-" + f.key);
        el.focus({ preventScroll: true });
        el.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
    }
    for (const [k, c] of Object.entries(PLAT)) {
      if (Math.hypot(p.x - c.x, p.y - c.y) < 72) { setPlatform(state.platform === k ? "" : k); return; }
    }
  });
  canvas.addEventListener("dragover", (e) => e.preventDefault());
  canvas.addEventListener("drop", (e) => { e.preventDefault(); readPhoto(e.dataTransfer.files[0]); });

  // ---------- save ----------
  const toastEl = $("toast");
  let toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (toastEl.hidden = true), 2600);
  }
  const IN_ARTIFACT = !!(window.claude && window.claude.use);
  const TOUCH = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const dlPromise = (async () => {
    try { return IN_ARTIFACT ? await window.claude.use("downloads") : null; } catch (e) { return null; }
  })();
  let sheetUrl = null;
  function showSheet(blob, filename) {
    if (sheetUrl) URL.revokeObjectURL(sheetUrl);
    sheetUrl = URL.createObjectURL(blob);
    $("sheet-img").src = sheetUrl;
    const link = $("sheet-dl");
    link.hidden = IN_ARTIFACT;
    link.href = sheetUrl;
    link.download = filename;
    $("sheet").hidden = false;
  }

  $("save").addEventListener("click", async () => {
    await ensureFont();
    const out = document.createElement("canvas");
    out.width = W * S; out.height = H * S;
    renderTo(out, false);
    const name = (state.values.name || "").trim().replace(/[\\/:*?"<>|#\s]+/g, "_").slice(0, 40);
    const filename = `PROFILE_${name || "card"}.png`;
    const blob = await new Promise((r) => out.toBlob(r, "image/png"));
    if (!IN_ARTIFACT && !TOUCH) {
      // normal web page on a PC: download straight away
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("画像を保存しました");
      return;
    }
    const dl = IN_ARTIFACT ? await Promise.race([dlPromise, new Promise((r) => setTimeout(() => r(null), 1500))]) : null;
    if (dl) {
      try {
        await dl.save({ filename, data: blob });
        toast("画像を保存しました");
        return;
      } catch (err) {
        const code = err && err.code;
        if (code === "declined") { toast("保存をキャンセルしました"); return; }
        if (code === "rate_limited") { toast("少し待ってからもう一度押してください"); return; }
      }
    }
    showSheet(blob, filename);
  });
  $("sheet-close").addEventListener("click", () => ($("sheet").hidden = true));
  $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").hidden = true; });

  // ---------- reset (two-step) ----------
  const resetBtn = $("reset");
  let armT;
  resetBtn.addEventListener("click", () => {
    if (!resetBtn.classList.contains("armed")) {
      resetBtn.classList.add("armed"); resetBtn.textContent = "もう一度押すと全部消えます";
      clearTimeout(armT); armT = setTimeout(() => { resetBtn.classList.remove("armed"); resetBtn.textContent = "リセット"; }, 3000);
      return;
    }
    clearTimeout(armT);
    resetBtn.classList.remove("armed"); resetBtn.textContent = "リセット";
    Object.assign(state, { values: {}, platform: "", font: "noto", color: THEME.colors[0][0], align: "left", zoom: 1, offX: 0, offY: 0 });
    applyStateToUI(); setAvatar(null);
    toast("リセットしました");
  });

  function applyStateToUI() {
    inputs.forEach((el) => (el.value = state.values[el.dataset.key] || ""));
    segBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.plat === state.platform)));
  }

  // ---------- boot ----------
  loadDraft();
  delete state.theme;
  Object.assign(state, { font: "noto", color: THEME.colors[0][0], align: "left" });
  applyStateToUI();
  tpl.onload = schedule;
  tpl.src = TPL_SRC;
  if (state.avatar) setAvatar(state.avatar, true); else syncPhotoUI();
  refresh();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", schedule);
})();
</script>
</body>
</html>
